name: Android

# Builds the Android port only. Nothing here touches the iPhone app.
on:
  push:
    paths: ['Android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      publish_models:
        description: 'Publish LavaSR and VoiceFixer to this Hugging Face model repository (owner/name; needs the HF_TOKEN secret). Empty: do not publish.'
        required: false
        default: ''

jobs:
  # LavaSR and VoiceFixer as ONNX, converted from the pinned upstream
  # checkpoints (checked by SHA-256) exactly as the iPhone app converts them
  # to Core ML. Kept in a cache keyed on the conversion scripts.
  neural-models:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            neural-models
            work/voicefixer
          key: neural-models-v2-${{ hashFiles('Android/scripts/neural/convert-*.py', 'Android/scripts/neural/requirements.txt') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python packages
        run: |
          python -m pip install --quiet torch==2.7.0 torchaudio==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet -r Android/scripts/neural/requirements.txt
      - name: Convert
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p neural-models
          python Android/scripts/neural/convert-lavasr.py work/lavasr neural-models/LavaSRv2.onnx | tee neural-models/lavasr.json
          python Android/scripts/neural/convert-voicefixer.py work/voicefixer neural-models/VoiceFixer.onnx | tee neural-models/voicefixer.json
      - run: ls -la neural-models && cat neural-models/*.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: LavaSR and VoiceFixer end to end
        working-directory: Android
        run: |
          ./scripts/neural/run-studio.sh ../neural-models ../work/studio
          python scripts/neural/check-voicefixer.py ../work/voicefixer ../work/studio/noisy.f32 ../work/studio/VoiceFixer.f32
      - uses: actions/upload-artifact@v4
        with:
          name: neural-models
          path: neural-models
          retention-days: 7
      # The folder to upload as a public Hugging Face model repository, for the
      # app's download on request (Android/scripts/neural/README.md).
      - name: Hugging Face folder
        run: |
          mkdir -p huggingface
          cp neural-models/LavaSRv2.onnx neural-models/VoiceFixer.onnx huggingface/
          cp Android/scripts/neural/huggingface-README.md huggingface/README.md
          cat neural-models/lavasr.json neural-models/voicefixer.json > huggingface/conversion.json
          (cd huggingface && sha256sum LavaSRv2.onnx VoiceFixer.onnx > SHA256SUMS && cat SHA256SUMS && ls -l)
      - uses: actions/upload-artifact@v4
        with:
          name: huggingface-upload
          path: huggingface
          retention-days: 30
      # Only on a manual run that names a repository: the folder above becomes
      # one commit of a public model repository, for the app's download on request.
      - name: Publish to Hugging Face
        if: github.event_name == 'workflow_dispatch' && inputs.publish_models != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REPOSITORY: ${{ inputs.publish_models }}
        run: python Android/scripts/neural/publish-huggingface.py "$REPOSITORY" huggingface

  build:
    needs: neural-models
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Core checks
        run: ./scripts/test-core.sh
      - name: DeepFilterNet3 parity
        run: |
          python3 -m pip install --quiet numpy onnxruntime
          ./scripts/dfn3-parity/run.sh
      - uses: actions/download-artifact@v4
        with:
          name: neural-models
          path: Android/build/neural-models
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: YouRec-debug-apk
          path: Android/build/outputs/apk/debug/*.apk

  # Runs the app once through record, edit and export on an emulator. Its
  # camera is synthetic: this shows the pipelines run, not that framing is right.
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: YouRec-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: python3 Android/scripts/emulator-smoke.py apk/*.apk smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke
          path: smoke
